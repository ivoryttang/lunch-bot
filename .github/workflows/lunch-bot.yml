name: Dinner Bot

on:
  workflow_dispatch: # Manual trigger
  schedule:
    # 01:30 UTC = 6:30 PM Pacific during PDT (summer). GitHub cron is fixed UTC
    # and does not follow DST, so during PST (winter) this lands at 5:30 PM.
    - cron: '30 1 * * *'

# Let the default GITHUB_TOKEN push polls.json/restaurants.json back to the repo.
permissions:
  contents: write

jobs:
  post-dinner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Post to Slack
        run: node bot.js
        env:
          # Bot token + channel enable reaction voting; webhook is the fallback.
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_CONTENTS_TOKEN || github.token }}
          GITHUB_REPO: ${{ github.repository }}
          PICKS_PER_DAY: 2
