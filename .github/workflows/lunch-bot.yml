name: Dinner Bot

on:
  workflow_dispatch: # Manual trigger only — daily posting runs via launchd on local Mac

jobs:
  post-dinner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Post to Slack
        run: node bot.js
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PICKS_PER_DAY: 2
