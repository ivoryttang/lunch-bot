apiVersion: v1 # Fill this in with the right values before deploying
kind: Secret
metadata:
  name: lunch-bot-secrets
type: Opaque
stringData:
  SLACK_SIGNING_SECRET: "foo"
  GITHUB_TOKEN: "foo"
  GITHUB_REPO: "ivoryttang/lunch-bot"
  PICKS_PER_DAY: "2"

  # Needed for the Kubernetes CronJob that runs `node bot.js`
  SLACK_BOT_TOKEN: "foo"
  SLACK_CHANNEL: "foo"

  # Optional fallback if you do not use SLACK_BOT_TOKEN + SLACK_CHANNEL
  SLACK_WEBHOOK_URL: "foo"
